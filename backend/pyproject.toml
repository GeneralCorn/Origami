[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.1",
    "fastapi>=0.132.0",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.9",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "fastembed>=0.5.0",
    "uvicorn>=0.41.0",
    # Image decoding and downscaling for the screenshot path. Pure-Python
    # wheels, no OpenCV.
    "pillow>=11.0",
    # On-device OCR through the macOS Vision framework. Darwin-only by
    # marker: the product is a signed macOS app and Vision is the engine
    # PRODUCT_DIRECTION.md says to evaluate first. Linux and CI resolve the
    # marker to nothing and fall through to the optional engine below.
    "pyobjc-framework-Vision>=12.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Cross-platform OCR fallback for machines without the Vision framework
# (Linux dev boxes, CI). RapidOCR ships PP-OCRv6 ONNX weights inside the
# wheel (~32 MB) and pulls opencv-python (~70 MB), which is why it is an
# extra rather than a core dependency: the packaged macOS app never needs it.
ocr-fallback = [
    "rapidocr>=3.9",
    "pillow-heif>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
