<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origami</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("origami-theme");
          if (theme === "dark" || theme === "palenight") {
            document.documentElement.classList.add(theme);
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
